name: sqtest
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://ipinfo.io/json | grep -E '"(city|region|country|org)"' || true
          curl -s -o body.txt -w "HTTP %{http_code}\n" -X POST "https://www.binance.com/bapi/composite/v2/public/pgc/openApi/image/presignedUrl" \
            -H "X-Square-OpenAPI-Key: test-invalid-key" -H "content-type: application/json" -H "clienttype: binanceSkill" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" \
            -d '{"imageName":"t.jpg"}'
          head -c 300 body.txt; echo
